# Production overlay: TLS termination with automatic Let's Encrypt certificates.
#
# Usage:
#   1. In .env set:  DOMAIN=leads.example.com  ACME_EMAIL=you@example.com
#      and set CORS_ORIGINS=https://leads.example.com
#   2. Point your domain's DNS A/AAAA record at this host and open ports 80+443.
#   3. Start:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Caddy fetches and renews certificates automatically and proxies to the
# hardened nginx frontend. The api/db/redis services stay on the internal
# network; the 127.0.0.1 port bindings in the base file remain loopback-only.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env for production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env for production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

  api:
    environment:
      # Marks cookies Secure and disables /docs + /openapi.json.
      ENVIRONMENT: production
    restart: unless-stopped

  worker:
    restart: unless-stopped

  scheduler:
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
